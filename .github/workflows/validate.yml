name: Validate Japanese Reader

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check publisher syntax and dry-run
        run: |
          python3 -m py_compile scripts/publish.py
          python3 scripts/publish.py dry_run
          python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check scripts/validate.mjs
      - name: Validate published content
        run: node scripts/validate.mjs
