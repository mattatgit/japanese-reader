name: Deploy Japanese Reader

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: japanese-reader-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Activate only after switching Settings → Pages → Source to GitHub Actions.
    if: vars.CUSTOM_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
